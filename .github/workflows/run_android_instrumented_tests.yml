name: Run Android Instrumented Tests
on:
  push:
    branches:
      - main
      - instrumentation/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firebase-instrumentation-tests:
    name: Firebase Test Lab (${{ matrix.license }} - ${{ matrix.organization }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        license: [ full, fdroid ]
        organization: [ ooni, dw ]
        exclude:
          - license: fdroid
            organization: dw

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create .sentryclirc
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "[auth]" > ~/.sentryclirc
          echo "token=$SENTRY_AUTH_TOKEN" >> ~/.sentryclirc

      - name: Build APKs
        run: ./gradlew copyBrandingToCommonResources assemble${{ matrix.license }}Debug assemble${{ matrix.license }}DebugAndroidTest -Porganization=${{ matrix.organization }}

      - name: Setup and authenticate with GCP
        env:
          SERVICE_CREDS: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
        run: |
          printf '%s' "$SERVICE_CREDS" > service_credentials_content.json
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CREDENTIAL_FILE_CONTENT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 495.0.0'

      - name: Firebase Test Lab
        run: >-
          LABEL=$(git show -s --format='%H')
          gcloud firebase test android run
          --type instrumentation
          --app androidApp/build/outputs/apk/${{ matrix.license }}/debug/androidApp-${{ matrix.license }}-universal-debug.apk
          --test androidApp/build/outputs/apk/androidTest/${{ matrix.license }}/debug/androidApp-${{ matrix.license }}-debug-androidTest.apk
          --device model=MediumPhone.arm,version=29,locale=en,orientation=portrait
          --timeout 120s
          --num-flaky-test-attempts=2
          --client-details matrixLabel="$LABEL"
          --use-orchestrator
          --environment-variables clearPackageData=true
          --project ooniprobe-android
          --test-targets "package org.ooni.probe.uitesting"

  emulator-instrumentation-tests:
    name: Android Emulator Runner (${{ matrix.license }} - ${{ matrix.organization }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        license: [ full, fdroid ]
        organization: [ ooni, dw ]
        exclude:
          - license: fdroid
            organization: dw

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create .sentryclirc
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "[auth]" > ~/.sentryclirc
          echo "token=$SENTRY_AUTH_TOKEN" >> ~/.sentryclirc

      - name: Run Android Instrumented Tests on Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew copyBrandingToCommonResources connected${{ matrix.license }}DebugAndroidTest -Porganization=${{ matrix.organization }} -Pandroid.testInstrumentationRunnerArguments.package=org.ooni.probe.uitesting

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report-${{ matrix.license }}-${{ matrix.organization }}
          path: |
            androidApp/build/reports/androidTests/connected/
            androidApp/build/outputs/androidTest-results/
          retention-days: 7

