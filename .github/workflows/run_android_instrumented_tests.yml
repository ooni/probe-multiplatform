name: Run Android Instrumented Tests
on:
  push:
    branches:
      - main
      - instrumentation/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firebase-instrumentation-tests:
    name: Firebase Test Lab (${{ matrix.license }} - ${{ matrix.organization }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        license: [ full, fdroid ]
        organization: [ ooni, dw ]
        exclude:
          - license: fdroid
            organization: dw

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create .sentryclirc
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "[auth]" > ~/.sentryclirc
          echo "token=$SENTRY_AUTH_TOKEN" >> ~/.sentryclirc

      - name: Build APKs
        run: ./gradlew copyBrandingToCommonResources assemble${{ matrix.license }}Debug assemble${{ matrix.license }}DebugAndroidTest -Porganization=${{ matrix.organization }}

      - name: Setup and authenticate with GCP
        env:
          SERVICE_CREDS: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
        run: |
          printf '%s' "$SERVICE_CREDS" > service_credentials_content.json
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CREDENTIAL_FILE_CONTENT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 495.0.0'

      - name: Firebase Test Lab
        run: >-
          LABEL=$(git show -s --format='%H')
          gcloud firebase test android run
          --type instrumentation
          --app androidApp/build/outputs/apk/${{ matrix.license }}/debug/androidApp-${{ matrix.license }}-universal-debug.apk
          --test androidApp/build/outputs/apk/androidTest/${{ matrix.license }}/debug/androidApp-${{ matrix.license }}-debug-androidTest.apk
          --device model=MediumPhone.arm,version=29,locale=en,orientation=portrait
          --timeout 120s
          --num-flaky-test-attempts=2
          --client-details matrixLabel="$LABEL"
          --use-orchestrator
          --environment-variables clearPackageData=true
          --project ooniprobe-android
          --test-targets "package org.ooni.probe.uitesting"

  emulator-instrumentation-tests:
    name: Android Emulator Runner (${{ matrix.license }} - ${{ matrix.organization }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        license: [ full, fdroid ]
        organization: [ ooni, dw ]
        exclude:
          - license: fdroid
            organization: dw

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create .sentryclirc
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "[auth]" > ~/.sentryclirc
          echo "token=$SENTRY_AUTH_TOKEN" >> ~/.sentryclirc

      - name: Run Android Instrumented Tests on Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew copyBrandingToCommonResources connected${{ matrix.license }}DebugAndroidTest -Porganization=${{ matrix.organization }} -Pandroid.testInstrumentationRunnerArguments.package=org.ooni.probe.uitesting

      - name: Publish Test Summary
        if: always()
        uses: actions/github-script@v8
        env:
          MATRIX_LICENSE: ${{ matrix.license }}
          MATRIX_ORG: ${{ matrix.organization }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function findXmlFiles(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results = results.concat(findXmlFiles(fullPath));
                } else if (entry.isFile() && entry.name.endsWith('.xml')) {
                  results.push(fullPath);
                }
              }
              return results;
            }

            const searchDirs = [
              'androidApp/build/outputs/androidTest-results',
              'androidApp/build/reports/androidTests/connected'
            ];

            let xmlFiles = [];
            for (const d of searchDirs) {
              xmlFiles = xmlFiles.concat(findXmlFiles(d));
            }
            xmlFiles = [...new Set(xmlFiles)];

            const license = process.env.MATRIX_LICENSE;
            const org = process.env.MATRIX_ORG;

            if (xmlFiles.length === 0) {
              await core.summary
                .addHeading(`🧪 Android Emulator Test Results (${license} - ${org})`, 3)
                .addRaw('No JUnit XML report files found.')
                .write();
              return;
            }

            let totalTests = 0, totalFailures = 0, totalErrors = 0, totalSkipped = 0, totalTime = 0.0;
            const cases = [];

            for (const file of xmlFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');

                const suiteMatches = content.matchAll(/<testsuite\b([^>]*)>/g);
                for (const m of suiteMatches) {
                  const attrs = m[1];
                  const getAttr = (name) => {
                    const match = attrs.match(new RegExp(`${name}="([^"]*)"`));
                    return match ? match[1] : null;
                  };
                  totalTests += parseInt(getAttr('tests') || '0', 10);
                  totalFailures += parseInt(getAttr('failures') || '0', 10);
                  totalErrors += parseInt(getAttr('errors') || '0', 10);
                  totalSkipped += parseInt(getAttr('skipped') || getAttr('disabled') || '0', 10);
                  totalTime += parseFloat(getAttr('time') || '0');
                }

                const caseMatches = content.matchAll(/<testcase\b([^/>]*)(?:\/>|>([\s\S]*?)<\/testcase>)/g);
                for (const m of caseMatches) {
                  const attrs = m[1] || '';
                  const body = m[2] || '';
                  const getAttr = (name) => {
                    const match = attrs.match(new RegExp(`${name}="([^"]*)"`));
                    return match ? match[1] : '';
                  };
                  const classname = getAttr('classname');
                  const name = getAttr('name');
                  const timeVal = getAttr('time') || '0';

                  let status = '✅ Passed';
                  let details = '';

                  if (body.includes('<failure')) {
                    status = '❌ Failed';
                    const failMatch = body.match(/<failure[^>]*>([\s\S]*?)<\/failure>/);
                    details = failMatch ? failMatch[1] : '';
                  } else if (body.includes('<error')) {
                    status = '💥 Error';
                    const errMatch = body.match(/<error[^>]*>([\s\S]*?)<\/error>/);
                    details = errMatch ? errMatch[1] : '';
                  } else if (body.includes('<skipped')) {
                    status = '⚠️ Skipped';
                  }

                  if (classname && name) {
                    cases.push({ classname, name, timeVal, status, details });
                  }
                }
              } catch (e) {
                console.error(`Error parsing ${file}:`, e);
              }
            }

            const passed = Math.max(0, totalTests - totalFailures - totalErrors - totalSkipped);
            const statusIcon = (totalFailures === 0 && totalErrors === 0 && totalTests > 0) ? '✅' : '❌';

            let summary = core.summary
              .addHeading(`${statusIcon} Android Emulator Test Summary (${license} - ${org})`, 3)
              .addTable([
                [
                  { data: 'Total', header: true },
                  { data: 'Passed', header: true },
                  { data: 'Failed', header: true },
                  { data: 'Errors', header: true },
                  { data: 'Skipped', header: true },
                  { data: 'Duration', header: true }
                ],
                [
                  String(totalTests),
                  String(passed),
                  String(totalFailures),
                  String(totalErrors),
                  String(totalSkipped),
                  `${totalTime.toFixed(2)}s`
                ]
              ]);

            if (totalFailures > 0 || totalErrors > 0) {
              summary = summary.addRaw('\n<details><summary><b>Failed Test Details</b></summary>\n\n');
              for (const c of cases) {
                if (c.status.includes('Failed') || c.status.includes('Error')) {
                  const shortClass = c.classname.split('.').pop();
                  summary = summary.addRaw(`#### ${c.status}: \`${shortClass}.${c.name}\` (${c.timeVal}s)\n\n`);
                  if (c.details) {
                    summary = summary.addRaw(`\`\`\`\n${c.details.trim().slice(0, 1000)}\n\`\`\`\n\n`);
                  }
                }
              }
              summary = summary.addRaw('</details>\n\n');
            }

            if (cases.length > 0) {
              summary = summary
                .addRaw('\n<details><summary><b>All Test Cases</b></summary>\n\n')
                .addTable([
                  [
                    { data: 'Status', header: true },
                    { data: 'Class', header: true },
                    { data: 'Test Case', header: true },
                    { data: 'Time', header: true }
                  ],
                  ...cases.map(c => [
                    c.status,
                    `\`${c.classname.split('.').pop()}\``,
                    `\`${c.name}\``,
                    `${c.timeVal}s`
                  ])
                ])
                .addRaw('\n</details>\n\n');
            }

            await summary.write();

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report-${{ matrix.license }}-${{ matrix.organization }}
          path: |
            androidApp/build/reports/androidTests/connected/
            androidApp/build/outputs/androidTest-results/
          retention-days: 7

